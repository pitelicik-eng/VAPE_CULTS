<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>VAPE_CULT</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--lime:#8fd12f;--smoke:#a278d8;--card:#14101c;--muted:#b9b2c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:#fff;font-family:'Rubik',system-ui,sans-serif;min-height:100%;overflow-x:hidden}
.logo,h1,h2{font-family:'Bangers',Impact,sans-serif;letter-spacing:.04em;font-weight:400;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:3px 3px 0 var(--smoke),-2px -2px 0 var(--smoke),2px -2px 0 var(--smoke),-2px 2px 0 var(--smoke);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:#000e;backdrop-filter:blur(6px);z-index:5}
.logo{font-size:28px}
.btn{font:600 14px 'Rubik',sans-serif;background:var(--lime);color:#000;border:2px solid #fff;border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--smoke);outline-offset:2px}
.btn.ghost{background:transparent;color:#fff;border-color:var(--smoke)}
.hero{position:relative;text-align:center;padding:4px 12px 8px;overflow:hidden}
.hero:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:var(--smoke);opacity:.28;filter:blur(60px);left:50%;top:30px;transform:translateX(-50%)}
.stage{touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;width:min(80%,300px);aspect-ratio:424/324;margin:0 auto;position:relative}
.stage:after{content:"";position:absolute;left:20%;right:20%;bottom:-14px;height:16px;border-radius:50%;background:#000;filter:blur(8px);opacity:.55;transform:scaleX(var(--sx,1))}
.stage.drag{cursor:grabbing}
.mascot{position:relative;width:100%;height:100%}
.mascot img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.mascot canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
h1{font-size:clamp(52px,15vw,100px);margin:0;line-height:1;position:relative}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);background:#000e;z-index:4;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;color:#fff;text-decoration:none;border:2px solid var(--smoke);border-radius:20px;padding:7px 14px;font-weight:600;font-size:14px}
main{max-width:900px;margin:0 auto;padding:0 16px 30px}
section{scroll-margin-top:120px;padding-top:18px}
h2{font-size:34px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.it{display:flex;gap:12px;background:var(--card);border:2px solid #2d2442;border-left:8px solid var(--c,var(--lime));border-radius:12px;padding:12px}
.tx{display:flex;flex-direction:column;gap:5px;min-width:0}
.tx b{font-size:17px}.price{color:var(--lime);font-weight:600}.tx small{color:var(--muted)}
.opt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.opt i{font-style:normal;color:var(--muted);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--smoke);border-radius:14px;padding:3px 10px;font-size:13px}
.tag u{width:12px;height:12px;border-radius:50%;border:1px solid #fff8;display:inline-block}
.empty{color:var(--muted)}
footer{text-align:center;color:var(--muted);padding:20px 16px 50px;font-size:13px}
.ov{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:20;padding:16px}
.ov.on{display:grid}
.box{background:var(--card);border:2px solid var(--lime);border-radius:16px;padding:18px;width:min(100%,440px);max-height:90vh;overflow:auto}
.box h2{font-size:30px}
input,textarea,select{width:100%;background:#000;color:#fff;border:2px solid var(--smoke);border-radius:10px;padding:10px;font:16px 'Rubik',sans-serif;margin:0 0 10px}
label{font-size:13px;color:var(--muted)}
.err{color:#ff6b6b;font-size:13px;min-height:18px}
.row{display:flex;gap:8px}.row .btn{flex:1}
.adm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid #333;padding:8px 0;font-size:14px}
.adm button{border:0;border-radius:8px;padding:7px 10px;cursor:pointer;color:#fff;background:#c0392b}
@media(prefers-reduced-motion:reduce){.mascot{transition:none}html{scroll-behavior:auto}}
</style></head>

  /* сетка */

  var pos=[],uv=[],zbk=[],n=0;

   if(dil[p]){vid[j*cols+i]=n++;pos.push(x-w/2,h/2-y,zF[p]);zbk.push(zS[p]);uv.push(x/w,1-y/h)}}
  var fi=[],bi=[];
  for(j=0;j<rows-1;j++)for(i=0;i<cols-1;i++){
   var a=vid[j*cols+i],b=vid[j*cols+i+1],c=vid[(j+1)*cols+i],e2=vid[(j+1)*cols+i+1];
   if(a>=0&&c>=0&&e2>=0){fi.push(a,c,e2);bi.push(a,e2,c)}

  function geo(P,I){var g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(P,3));

  var tf=new T.Texture(base);tf.needsUpdate=true;tf.encoding=T.sRGBEncoding;

  scene.add(new T.AmbientLight(0xffffff,.32));scene.add(new T.HemisphereLight(0xffffff,0x3a2a55,.5));
  var key=new T.DirectionalLight(0xffffff,1.05);key.position.set(-250,350,500);scene.add(key);
  var rim=new T.DirectionalLight(0xa278d8,1.2);rim.position.set(300,150,-400);scene.add(rim);
  var fill=new T.DirectionalLight(0x8fd12f,.3);fill.position.set(300,-200,300);scene.add(fill);
  tilt=new T.Group();spin=new T.Group();tilt.add(spin);scene.add(tilt);
  spin.add(new T.Mesh(geo(pos,fi),mF));
  spin.add(new T.Mesh(geo(posB,bi),mB));
  var sm=new T.Mesh(new T.PlaneGeometry(w,h),mS);sm.renderOrder=2;spin.add(sm);
  m.appendChild(renderer.domElement);base.style.display='none';
  size();window.addEventListener('resize',size);ready=true;
 }
 function size(){var W=st.clientWidth,H=st.clientHeight;if(!W||!H)return;renderer.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix()}
 function render(){st.style.setProperty('--sx',Math.max(.3,Math.abs(Math.cos(ry*D2R))).toFixed(3));
  if(!ready){base.style.transform='perspective(800px) rotateY('+ry.toFixed(1)+'deg)';return}
  spin.rotation.y=ry*D2R;tilt.rotation.x=rx*D2R;renderer.render(scene,cam)}

   if(auto&&AUTO)rx+=((-8+6*Math.sin(t/1500))-rx)*0.04*k;

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyD1Jww_82yRKjMBSnEFrpq3PwWsyiRXTzk",
  authDomain: "vapecult-997b9.firebaseapp.com",
  projectId: "vapecult-997b9",
  storageBucket: "vapecult-997b9.firebasestorage.app",
  messagingSenderId: "599225566062",
  appId: "1:599225566062:web:673761e60e6a10e655f77f"
});
const db = getFirestore(app), col = collection(db, "products");
let remoteIds = new Set();
onSnapshot(col, snap => {
  remoteIds = new Set(snap.docs.map(d => d.id));
  if (snap.metadata.hasPendingWrites || snap.empty) return;
  window.setProducts(snap.docs.map(d => d.data()).sort((a, b) => a.id - b.id));
}, err => console.error("Firestore:", err));
window.fbPush = async list => {
  const b = writeBatch(db);
  list.forEach(p => b.set(doc(db, "products", String(p.id)), p));
  remoteIds.forEach(id => { if (!list.some(p => String(p.id) === id)) b.delete(doc(db, "products", id)); });
  await b.commit();
  remoteIds = new Set(list.map(p => String(p.id)));
};
</script>
